<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Remote for Deezer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <section id="empty" class="empty" hidden>
    <div id="spinner" class="spinner" role="status" data-i18n-aria-label="loading" hidden></div>
    <p id="empty-message" data-i18n="noDeezerTab"></p>
    <button id="launch" class="primary" data-i18n="launchHidden"></button>
  </section>

  <section id="player" class="player" hidden>
    <div class="track">
      <img id="cover" class="cover" alt="">
      <a id="title" class="title" href="#" data-i18n-title="showDeezerTab"></a>
      <div id="artists" class="artists"></div>
    </div>

    <div class="progress">
      <span id="elapsed">0:00</span>
      <input id="seek" type="range" min="0" max="0" step="1" value="0" data-i18n-aria-label="position">
      <span id="duration">0:00</span>
    </div>

    <div class="controls">
      <button id="shuffle" class="icon small" data-i18n-title="shuffle">
        <svg viewBox="0 0 24 24"><path d="M16 3h5v5l-1.8-1.8-4.4 4.4-1.4-1.4 4.4-4.4L16 3zM3 5.4 4.4 4 20 19.6 18.6 21 3 5.4zM14.4 13l1.4-1.4 3.4 3.4L21 13.2V19h-5.8l1.8-1.8-2.6-2.6zM3 19.6l6-6 1.4 1.4-6 6L3 19.6z"/></svg>
      </button>
      <button id="previous" class="icon" data-i18n-title="previous">
        <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <button id="play" class="icon play" data-i18n-title="playPause">
        <svg class="when-paused" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
        <svg class="when-playing" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
      <button id="next" class="icon" data-i18n-title="next">
        <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg>
      </button>
      <button id="repeat" class="icon small" data-i18n-title="repeat">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        <span id="repeat-one" class="badge" hidden>1</span>
      </button>
    </div>

    <div id="autoplay-warning" class="warning" role="alert" hidden>
      <strong data-i18n="autoplayBlockedTitle"></strong>
      <p data-i18n="autoplayBlockedText"></p>
      <p><span data-i18n="autoplayHowtoStart"></span> <em data-i18n="autoplayMenu"></em> → <em data-i18n="autoplayOption"></em><span data-i18n="autoplayHowtoEnd"></span></p>
      <button id="autoplay-show" class="link" data-i18n="showDeezerTab"></button>
    </div>

    <div class="footer">
      <button id="like" class="icon small" data-i18n-title="favourites">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>
      </button>
      <button id="visibility" class="icon small" data-i18n-title="hideDeezerTab">
        <svg class="when-visible" viewBox="0 0 24 24"><path d="M12 5C6.5 5 2.7 9.4 1.5 12c1.2 2.6 5 7 10.5 7s9.3-4.4 10.5-7C21.3 9.4 17.5 5 12 5zm0 11.5a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9zm0-2.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
        <svg class="when-hidden" viewBox="0 0 24 24"><path d="M3.3 2 2 3.3l3.4 3.4C3.5 8.1 2.2 10.1 1.5 12c1.2 2.6 5 7 10.5 7 1.9 0 3.6-.5 5.1-1.3l3.6 3.6 1.3-1.3L3.3 2zM12 16.5A4.5 4.5 0 0 1 7.5 12c0-.8.2-1.5.5-2.2l1.6 1.6a2 2 0 0 0 3 3l1.6 1.6c-.7.3-1.4.5-2.2.5zM12 5c-1.4 0-2.7.3-3.9.8l2 2c.6-.2 1.2-.3 1.9-.3a4.5 4.5 0 0 1 4.5 4.5c0 .7-.1 1.3-.3 1.9l3.1 3.1c1.5-1.3 2.6-2.8 3.2-4C21.3 9.4 17.5 5 12 5z"/></svg>
      </button>
      <button id="mute" class="icon small" data-i18n-title="muteTab">
        <svg class="when-unmuted" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
        <svg class="when-muted" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>
      </button>
      <input id="volume" type="range" min="0" max="100" step="1" value="0" data-i18n-aria-label="volume" disabled>
    </div>
  </section>

  <p id="error" class="error" hidden></p>

  <script type="module" src="popup.js"></script>
</body>
</html>
